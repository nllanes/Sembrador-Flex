services:
  db:
    image: postgres:16-alpine
    container_name: flex_onboarding_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flex}
      POSTGRES_DB: ${POSTGRES_DB:-flex_onboarding}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flex} -d ${POSTGRES_DB:-flex_onboarding}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: flex_onboarding_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-flex}:${POSTGRES_PASSWORD:-flex}@db:5432/${POSTGRES_DB:-flex_onboarding}
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "8080:8000"
    volumes:
      - .:/app

volumes:
  pgdata:
